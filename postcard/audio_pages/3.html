<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:"STKaiti","KaiTi","Noto Serif SC",serif;
  background:#11100e; color:#fff1cc;
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; min-height:100vh;
  text-align:center; padding:20px;
  -webkit-tap-highlight-color:transparent;

.flame {

  background:radial-gradient(circle,#ffcf66 0%,#d9391f 50%,#11100e 80%);
  margin-bottom:24px; animation:pulse 2s infinite;

p { color:rgba(248,223,172,.7); font-size:.9em; margin-bottom:20px; }
button {
  background:#d9391f; color:#fff1cc; border:none;
  padding:14px 40px; border-radius:30px; font-size:1.1em;
  font-family:inherit; cursor:pointer; letter-spacing:2px;
  -webkit-appearance:none; touch-action:manipulation;
}
button:active { background:#f0b94d; color:#1b0f0a; }
.audio-info { margin-top:16px; font-size:.75em; color:rgba(240,185,77,.5); }
